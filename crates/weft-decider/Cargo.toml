[package]
name = "weft-decider"
description = "weft decider: runs weft-verifier, persists its state before acting, drives the executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Published files: sources and the licence (repository tests and requirements stay in git).
include = ["src/**/*.rs", "LICENSE"]

[dependencies]
weft-verifier.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
turmoil = { workspace = true, features = ["unstable-fs"] }
tokio = { workspace = true, features = ["rt", "time"] }

[lints]
workspace = true
