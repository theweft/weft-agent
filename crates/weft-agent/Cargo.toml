[package]
name = "weft-agent"
description = "weft agent for Linux devices and gateways: node runtime (sync, decider, executor)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Published files: sources and the licence (repository tests and requirements stay in git).
include = ["src/**/*.rs", "LICENSE"]
readme = "../../README.md"

[[bin]]
name = "weft-agent"
path = "src/main.rs"

[dependencies]
weft-verifier.workspace = true
weft-transport.workspace = true
weft-sync.workspace = true
weft-decider.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
serde_json.workspace = true
clap.workspace = true

[dev-dependencies]
weft-transport = { workspace = true, features = ["turmoil"] }
turmoil.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time", "rt"] }
ed25519-dalek.workspace = true

[lints]
workspace = true
