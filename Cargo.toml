[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/theweft/weft-agent"
homepage = "https://theweft.org"

# Exact versions: updates are deliberate (Dependabot PR + review).
[workspace.dependencies]
weft-verifier = { version = "=0.0.2", path = "../weft-verifier" }
weft-transport = { version = "=0.0.0", path = "crates/weft-transport" }
weft-sync = { version = "=0.0.0", path = "crates/weft-sync" }
weft-decider = { version = "=0.0.0", path = "crates/weft-decider" }
tokio = { version = "=1.53.2", default-features = false }
turmoil = { version = "=0.7.2" }
ed25519-dalek = { version = "=3.0.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The agent handles untrusted input: no panics on any input.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"

[profile.release]
overflow-checks = true
