# Pinned toolchain. Nix (flake.nix) and rustup both read this file.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
# Linux device and gateway targets (see `just targets`).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "riscv64gc-unknown-linux-gnu"]
